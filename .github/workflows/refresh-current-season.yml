name: Refresh current NFL season

on:
  workflow_dispatch:
  schedule:
    # Ask for a runner before 6:00 AM and away from GitHub's busy
    # top-of-hour window. The job waits below before refreshing data.
    - cron: "47 5 * * 2"
      timezone: "America/New_York"

permissions:
  contents: write

concurrency:
  group: refresh-current-nfl-season
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Wait until 6:00 AM Eastern
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          target_epoch=$(TZ=America/New_York date -d "$(TZ=America/New_York date +%F) 06:00:00" +%s)
          now_epoch=$(date +%s)
          wait_seconds=$((target_epoch - now_epoch))
          if (( wait_seconds > 0 )); then
            echo "Runner is ready early; waiting ${wait_seconds} seconds for 6:00 AM Eastern."
            sleep "$wait_seconds"
          else
            echo "Runner started at or after 6:00 AM Eastern; continuing immediately."
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Refresh and validate current season
        run: |
          python snapshot_live_leaderboard.py
          python update_live_sources.py --force
          python refresh_current_season.py --validate-only
          python -m pytest -q
          git diff --check

      - name: Commit validated generated data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/team_game_estat.csv data/team_season_estat.csv data/games_2005_onward.csv
          git add data/live_leaderboard_weekly_history.csv
          git add data/live_leaderboard_refresh_baseline.csv
          git add data/live_sources/*.csv data/live_sources/last_live_source_refresh.txt data/live_sources/last_live_source_refresh_status.json
          if git diff --cached --quiet; then
            echo "No validated data changes to commit."
          else
            git commit -m "Scheduled current-season NFL refresh"
            git push
          fi
